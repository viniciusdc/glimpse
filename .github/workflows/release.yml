name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

# Linux and macOS. Windows is not built, and that is not an oversight.
#
# This comment used to say only Linux was built, reasoning that Glimpse works by
# being a window that knows its own position and declares its own capture
# rectangle, and that macOS does not allow it. The second half was measured and
# is false — see docs/adr/0011 for the correction and docs/adr/0017 for the
# window model it settled on. macOS records through the same chrome Linux runs.
#
# Windows stays untouched. Nobody has measured anything there, so read its
# absence as unexamined rather than settled, which is exactly the mistake this
# comment used to make about macOS.
#
# The two platforms ship different SHAPES, not the same artifact twice. Linux is
# a bare binary in a tarball: GTK comes from the distribution and a binary on the
# PATH is what the platform expects. macOS is an .app bundle carrying its own GTK
# dylibs, because Screen Recording permission attaches to an application identity
# and a bare binary has none (docs/adr/0013).

# Third-party actions are pinned to commit SHAs rather than tags. A tag is
# mutable: whoever controls the action can repoint v7 at new code, and it runs
# here with whatever permissions the job has. The trailing comment records which
# release each SHA was, since a bare SHA tells a reader nothing.

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install GTK4 headers and ffmpeg
        run: |
          sudo apt-get update
          timeout 5m sudo apt-get install -y --no-install-recommends libgtk-4-dev ffmpeg

      # A tag and a crate version that disagree ship an artifact named one thing
      # built from a crate that calls itself another, so `glimpse --version`
      # would contradict the file the user downloaded.
      - name: Tag must match the crate version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate (expected v$crate)"
            exit 1
          fi
          echo "tag $tag matches crate version $crate"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A release is the one build worth verifying end to end rather than
      # trusting, so the full suite runs against the exact tree being shipped.
      - run: cargo test --locked --release

      - run: cargo build --locked --release
      - name: Package
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          dir="glimpse-${version}-linux-x86_64"
          mkdir -p "$dir"
          cp target/release/glimpse "$dir/"
          strip "$dir/glimpse"
          cp README.md LICENSE NOTICE "$dir/"
          cp data/glimpse.desktop "$dir/"
          tar -czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          ls -la *.tar.gz*

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256

  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install GTK4, ffmpeg and the icon theme
        run: |
          brew install gtk4 ffmpeg pkgconf adwaita-icon-theme

      # Same check the Linux job makes, and for the same reason: an artifact
      # named one thing built from a crate that calls itself another means
      # `glimpse --version` contradicts the file the user downloaded.
      - name: Tag must match the crate version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate (expected v$crate)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Everything except glimpse-x11, which cannot build against a Quartz GTK.
      # The Linux job above covers that half.
      - run: cargo test --locked --release -p glimpse-core -p glimpse-ui -p glimpse-macos -p glimpse

      # Builds the bundle and refuses to finish unless no Homebrew path survives
      # in it and the app it just built starts.
      - name: Build the app bundle
        run: make bundle-macos

      # The check that matters for something people download: the artifact has
      # to work where Homebrew was never installed, and that cannot be verified
      # on any machine capable of building it. A runner is a throwaway VM, so it
      # is verified by taking Homebrew away.
      - name: The bundle runs with Homebrew taken away
        run: |
          set -u
          BREW=$(brew --prefix)
          restore() { [ -d "$BREW.hidden" ] && sudo mv "$BREW.hidden" "$BREW"; }
          trap restore EXIT
          sudo mv "$BREW" "$BREW.hidden"
          log=$(mktemp)
          ./target/Glimpse.app/Contents/MacOS/glimpse >"$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            grep -q 'capture rect' "$log" && break
            kill -0 $pid 2>/dev/null || break
            sleep 0.5
          done
          kill $pid 2>/dev/null || true
          restore
          trap - EXIT
          sed 's/^/  /' "$log"
          grep -q 'capture rect' "$log" || {
            echo '::error::the bundle is not relocatable; refusing to publish it'
            exit 1
          }

      - name: Package
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          dir="glimpse-${version}-macos-arm64"
          mkdir -p "$dir"
          cp -R target/Glimpse.app "$dir/"
          cp README.md LICENSE NOTICE "$dir/"
          # zip, not tar: it is what macOS produces and consumes, and it
          # preserves the symlinks and permissions inside a bundle.
          ditto -c -k --sequesterRsrc --keepParent "$dir" "${dir}.zip"
          shasum -a 256 "${dir}.zip" > "${dir}.zip.sha256"
          ls -la *.zip*

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.zip
            *.zip.sha256
          body: |
            **Linux x86_64** — a bare binary. Needs an X11 session, GTK4 >= 4.10
            and ffmpeg.

            **macOS arm64** — `Glimpse.app`, carrying its own GTK. Needs ffmpeg,
            and Screen Recording permission, which macOS will ask for the first
            time you record.

            The macOS bundle is **ad-hoc signed, not notarized**. Downloaded
            through a browser it is quarantined and macOS will say it is damaged;
            fetched with `curl` or `scripts/install.sh` it is not. See
            `docs/adr/0013`.

            Windows is unexamined rather than refused.

