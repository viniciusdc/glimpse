name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

# Only Linux is built, and that is not an oversight.
#
# Glimpse is an X11 application by design rather than by omission: it works by
# being a window that knows its own position on screen and declares its own
# capture rectangle, which is a thing Wayland's portal model and both macOS and
# Windows deliberately do not allow. It also links gdk4-x11 and x11rb and shells
# out to ffmpeg's x11grab. A macOS or Windows target would not be a port; it
# would be a different application. See docs/adr/0002 and docs/adr/0006.

# Third-party actions are pinned to commit SHAs rather than tags. A tag is
# mutable: whoever controls the action can repoint v7 at new code, and it runs
# here with whatever permissions the job has. The trailing comment records which
# release each SHA was, since a bare SHA tells a reader nothing.

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install GTK4 headers and ffmpeg
        run: |
          sudo apt-get update
          timeout 5m sudo apt-get install -y --no-install-recommends libgtk-4-dev ffmpeg

      # A tag and a crate version that disagree ship an artifact named one thing
      # built from a crate that calls itself another, so `glimpse --version`
      # would contradict the file the user downloaded.
      - name: Tag must match the crate version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate (expected v$crate)"
            exit 1
          fi
          echo "tag $tag matches crate version $crate"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A release is the one build worth verifying end to end rather than
      # trusting, so the full suite runs against the exact tree being shipped.
      - run: cargo test --locked --release

      - run: cargo build --locked --release
      - name: Package
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          dir="glimpse-${version}-linux-x86_64"
          mkdir -p "$dir"
          cp target/release/glimpse "$dir/"
          strip "$dir/glimpse"
          cp README.md LICENSE NOTICE "$dir/"
          cp data/glimpse.desktop "$dir/"
          tar -czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          ls -la *.tar.gz*

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          body: |
            Linux x86_64 only — Glimpse is an X11 application by design, not by
            omission. See `docs/adr/0002` for why a macOS or Windows build would
            be a different application rather than a port.

            Requires an X11 session, GTK4 >= 4.10 and ffmpeg at runtime.
