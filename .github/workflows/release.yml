name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

# Only Linux is built, and that is not an oversight.
#
# Glimpse is an X11 application by design rather than by omission: it works by
# being a window that knows its own position on screen and declares its own
# capture rectangle, which is a thing Wayland's portal model and both macOS and
# Windows deliberately do not allow. It also links gdk4-x11 and x11rb and shells
# out to ffmpeg's x11grab. A macOS or Windows target would not be a port; it
# would be a different application. See docs/adr/0002 and docs/adr/0006.

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install GTK4 headers and ffmpeg
        run: |
          sudo apt-get update
          timeout 5m sudo apt-get install -y --no-install-recommends libgtk-4-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A release is the one build worth verifying end to end rather than
      # trusting, so the full suite runs against the exact tree being shipped.
      - run: cargo test --locked --release

      - run: cargo build --locked --release
      - name: Package
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          dir="glimpse-${version}-linux-x86_64"
          mkdir -p "$dir"
          cp target/release/glimpse "$dir/"
          strip "$dir/glimpse"
          cp README.md LICENSE NOTICE "$dir/"
          cp data/glimpse.desktop "$dir/"
          tar -czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          ls -la *.tar.gz*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          body: |
            Linux x86_64 only — Glimpse is an X11 application by design, not by
            omission. See `docs/adr/0002` for why a macOS or Windows build would
            be a different application rather than a port.

            Requires an X11 session, GTK4 >= 4.10 and ffmpeg at runtime.
