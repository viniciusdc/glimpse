name: Check

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand. Added after two pushes landed on main without
  # producing a run at all, leaving commits that were never verified and no way
  # to ask for verification after the fact.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 development headers
        run: |
          sudo apt-get update
          timeout 5m sudo apt-get install -y libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Documentation drift is invisible to the compiler, and was the largest
      # category of finding in this project's first review. Cheapest gate here,
      # so it runs first.
      - run: make docs-check

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Only the display-independent tests can run here: the geometry chain
      # needs a live X server, and CI has none. `make selftest` covers the rest
      # on a real machine — see docs/development.md.
      - run: cargo test
