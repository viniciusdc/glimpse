name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless. Cancel it rather than paying for
# both — except on main, where every commit's result is worth keeping.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # incremental artifacts are useless to a fresh runner

# Third-party actions are pinned to commit SHAs rather than tags. A tag is
# mutable: whoever controls the action can repoint v7 at new code, and it runs
# here with whatever permissions the job has. The trailing comment records which
# release each SHA was, since a bare SHA tells a reader nothing.

jobs:
  # Needs no toolchain and no system libraries, so it answers in seconds and
  # catches the largest category of finding this project has had: docs drifting
  # from the code.
  # Which of the jobs below are worth running for this change.
  #
  # NOT a `paths:` filter on the workflow. That was the obvious implementation and
  # it is a trap here: a workflow skipped by a path filter never reports its
  # checks at all, and `main` requires them, so a docs-only pull request would sit
  # forever on "Expected — waiting for status to be reported" with no way to merge
  # it short of editing the protection rule. A job skipped by `if:` still reports.
  #
  # This job is itself a required check. If it were not, a failure here would skip
  # every job downstream, each skip would report as success, and the pull request
  # would become mergeable having compiled nothing. The classify step also
  # defaults to code=true on any error, so the two failure modes are covered from
  # both ends.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      md: ${{ steps.classify.outputs.md }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: classify
        run: |
          # Anything unexpected means run everything. A change that silently
          # skipped the test suite because this script tripped over a filename
          # would be the worst outcome available here.
          set +e

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "md=" >> "$GITHUB_OUTPUT"
            echo "not a pull request — running everything"
            exit 0
          fi

          git fetch --no-tags --quiet origin "${{ github.base_ref }}" || {
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "md=" >> "$GITHUB_OUTPUT"
            echo "could not fetch the base — running everything"; exit 0; }

          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if [ -z "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "md=" >> "$GITHUB_OUTPUT"
            echo "empty diff — running everything"; exit 0
          fi

          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          # Documentation is *.md plus everything under docs/. Note what is NOT
          # here: .github/, scripts/ and Makefile are code, because a change to a
          # gate has to be run to know it still gates.
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|*.md|LICENSE|NOTICE) ;;
              *) code=true ;;
            esac
          done <<< "$changed"

          md=$(echo "$changed" | grep -E '\.md$' | tr '\n' ' ')

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "md=$md" >> "$GITHUB_OUTPUT"
          echo
          if [ "$code" = true ]; then
            echo "non-documentation files changed — running the full suite"
          else
            echo "documentation only — skipping build, tests and journeys"
          fi
          echo "markdown touched: ${md:-none}"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make docs-check

      # Only the markdown this change touched. A pull request answers for the
      # links it introduces or edits, not for the forty it left alone — and
      # re-checking those every time is how a link check becomes something people
      # skim past. Nothing to check is a pass, which is the common case.
      #
      # Only a 404 or 410 fails. A timeout, a 5xx or a 429 is somebody else having
      # a bad afternoon and says nothing about whether the link is right.
      - name: External links in the changed docs
        run: ./scripts/check-links-external.sh ${{ needs.changes.outputs.md }}

  # Formatting needs rustfmt and nothing else — no GTK, no cache, no build.
  # Kept separate so it fails in ~15s instead of behind a five-minute compile.
  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
        with:
          components: rustfmt
      - run: cargo fmt --check

  # `glimpse-core` is toolkit-free by manifest (ADR 0010), so it builds and tests
  # anywhere. Running it on macOS BEFORE a macOS frontend exists is the point:
  # it is the cheapest guard against the core quietly re-acquiring a Linux
  # assumption while a second frontend is being written. It has already caught
  # two — see that ADR's Consequences.
  #
  # `glimpse-x11` is deliberately absent: `gdk4-x11` cannot build against a
  # Quartz-backend GTK, so asking for it here would fail at the -sys crate
  # without telling anyone anything.
  core-macos:
    name: Core on macOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ffmpeg for the same reason as the Linux job: the media tests self-skip
      # without it, and a suite that skips looks exactly like a suite that
      # passes.
      #
      # GTK because `glimpse-macos` stopped being toolkit-free when the window
      # model landed. Its `grab` and `geometry` modules are still portable and
      # are what the LINUX job covers, which is why this job is the only one that
      # notices GTK missing. `pkgconf` provides pkg-config, which the -sys crates
      # shell out to; without it the failure is `gdk-pixbuf-2.0 not found` rather
      # than anything mentioning GTK.
      # Homebrew's bottle downloads, not its Cellar. Restoring a poured Cellar
      # would mean restoring symlinks and receipts that brew expects to own, and
      # a half-restored prefix fails in ways that read as a broken formula. The
      # download half is the part worth caching anyway: gtk4 alone is a 29MB
      # bottle and pulls 16 more.
      #
      # Keyed on the workflow file, so changing which packages are installed
      # invalidates it rather than silently restoring the old set.
      - name: Cache Homebrew downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/check.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-

      # The runner image ships aws/tap, and Homebrew now declines to load anything
      # from an untrusted tap. That prints a long notice on every run.
      #
      # Trust it by name. NOT HOMEBREW_NO_REQUIRE_TAP_TRUST=1, which Homebrew
      # itself offers and which switches the check off for everything, including
      # taps a future runner image adds. Naming this one keeps that: if the image
      # gains another tap, the notice comes back and somebody decides about it,
      # which is the check working rather than a nuisance to be silenced.
      #
      # Nothing here installs from it — ffmpeg and gtk4 both resolve to
      # homebrew/core via ghcr.io, confirmed in the run logs — so this only
      # quiets the notice. `|| true` because the image's taps are not ours to
      # depend on, and a missing one should not fail the build.
      - name: Trust the taps the runner image ships
        run: |
          brew trust --tap aws/tap || true
          echo "trusted taps:"; brew trust --json v1 2>/dev/null || echo "  (none recorded)"

      - name: Install system dependencies if the image lacks them
        run: |
          need=()
          command -v ffmpeg      >/dev/null || need+=(ffmpeg)
          command -v pkg-config  >/dev/null || need+=(pkgconf)
          pkg-config --exists gtk4 2>/dev/null || need+=(gtk4)
          if [ ${#need[@]} -eq 0 ]; then
            echo "nothing to install"
          else
            echo "installing: ${need[*]}"
            brew install "${need[@]}"
          fi
          ffmpeg -version | head -1
          echo "gtk4: $(pkg-config --modversion gtk4)"
          echo "gtk4-macos backend: $(pkg-config --exists gtk4-macos && echo present || echo ABSENT)"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo clippy --locked -p glimpse-core -p glimpse-ui -p glimpse -p glimpse-macos --all-targets -- -D warnings

      - name: Test
        run: |
          set -o pipefail
          cargo test --locked -p glimpse-core -p glimpse-ui -p glimpse -p glimpse-macos -- --nocapture 2>&1 | tee test.log
      - name: Confirm the media tests were not skipped
        run: |
          if grep -q 'skipping: ffmpeg not installed' test.log; then
            echo '::error::media tests skipped even though ffmpeg is installed'
            exit 1
          fi
          echo "media tests ran"

      # This step used to assert that the binary REFUSES on macOS, because macOS
      # had no frontend. It has one as of this change, so the assertion is not
      # merely stale: it hangs. `glimpse` with no arguments now enters the GTK
      # main loop and there is no quit control yet, so the step ran until the
      # job's 20-minute timeout killed it, which reads in the UI as a slow build
      # rather than as a check whose premise expired. The tell was at the end of
      # the cancelled run: `Terminate orphan process: pid (10743) (glimpse)`.
      #
      # Staying up is now the pass, so the check has to be bounded by us rather
      # than by the job timeout. Three outcomes, each distinguished, because a
      # launch check that lumps "died instantly" together with "came up but never
      # drew" cannot tell a broken frontend from a runner with no window server,
      # and the whole point of running this on a real macOS machine is to tell
      # those apart.
      - name: The binary builds, launches and places the frame
        run: |
          cargo build --locked --release
          ./target/release/glimpse --version

          # --help is answered before a toolkit is touched and it names the
          # platforms a frontend exists for. That list is a single constant in
          # main.rs shared with the refusal message; if macOS drops out of it the
          # binary is misdescribing itself to whoever runs it.
          ./target/release/glimpse --help | tee help.log
          if ! grep -q 'macOS' help.log; then
            echo '::error::--help no longer lists macOS as supported'
            exit 1
          fi

          ./target/release/glimpse > launch.log 2>&1 &
          pid=$!
          for _ in $(seq 1 45); do
            grep -q 'frame up' launch.log && break
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done

          if grep -q 'frame up. capture rect' launch.log; then
            # It placed both windows AND agreed with itself about the recorded
            # region: app.rs bails if the hole and the frame inset by its border
            # disagree, so reaching this line is that invariant holding on a
            # machine nobody configured.
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "the frontend came up and placed the frame:"
            cat launch.log
          elif kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo '::error::glimpse stayed up but never placed the frame'
            cat launch.log
            exit 1
          else
            rc=0; wait "$pid" || rc=$?
            echo "::error::glimpse exited $rc before placing the frame"
            cat launch.log
            exit 1
          fi

  # The integration half. Everything else in this workflow runs `cargo`, which
  # never launches the application: `smoke.sh` and `selftest.sh` existed for a
  # long time and no job called them, so the journeys they drive were verified
  # exactly as often as somebody remembered to run them locally.
  #
  # Three of the five journeys were driven by nothing at all until now, and they
  # are the durability guarantees ADR 0002 was written for. The state machine
  # covers those as policy in 17 instant tests; what nothing covered is that the
  # UI is wired to that policy.
  #
  # X11 only, because that is the only frontend that exists. This job is what
  # will notice when the macOS one arrives and these stop being the whole story.
  journeys:
    name: User journeys
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # GTK prints, verbatim: "If you are attempting to run GTK without a11y
      # support, GTK_A11Y should be set to 'none'". There is no accessibility
      # bus on a CI runner and nothing here needs one, so take the advice rather
      # than reading the warning on every run and learning to skim past it.
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/check.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      # Xvfb AND x11-utils. `headless.sh` refuses without xdpyinfo rather than
      # proceeding, because its "is this display already in use" guard is an
      # `if` on that command's exit status and a missing binary would make the
      # guard silently pass.
      - name: Install system dependencies
        run: |
          # Keep the .debs so the cache above has something to save, and let apt
          # find any the cache restored.
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99keep-debs >/dev/null
          need=()
          pkg-config --exists gtk4 || need+=(libgtk-4-dev)
          command -v ffmpeg   >/dev/null || need+=(ffmpeg)
          command -v Xvfb     >/dev/null || need+=(xvfb)
          command -v xdpyinfo >/dev/null || need+=(x11-utils)
          if [ ${#need[@]} -eq 0 ]; then
            echo "nothing to install"
          else
            echo "installing: ${need[*]}"
            sudo apt-get update
            timeout 5m sudo apt-get install -y --no-install-recommends "${need[@]}"
          fi
          ffmpeg -version | head -1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Geometry and the input region, against a real X server. CI can run the
      # mechanical half — the shape verdict and that a grab succeeded — but not
      # the half that matters most, which is a human looking at the PNG. Running
      # it here still catches a hole punched in the wrong place or a grab that
      # fails outright.
      - name: Self-test, off-screen
        run: make selftest-headless

      # `libEGL warning: DRI3 error` on Xvfb is expected and deliberately not
      # silenced. Xvfb has no DRI3, so GSK falls back to software rendering, and
      # the warning is the fallback announcing itself rather than a failure.
      #
      # It could be removed with GSK_RENDERER=cairo, and that is exactly why it
      # is not: the shipping app uses the GL renderer, and a self-test that
      # renders through a different one is checking something that does not
      # ship. Noise in a log is a smaller cost than a check that quietly moved.
      #
      # Record to GIF, record to MP4, snapshot, cancel mid-encode, and retry a
      # preserved capture. Each drives the same buttons a user presses.
      - name: Every user journey, off-screen
        run: make journeys

  test:
    name: Clippy and tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ffmpeg is a RUNTIME dependency, and without it every encoding test
      # silently skips — which is what CI did until now, so the encode and
      # snapshot paths had no coverage here at all.
      # Measured: installing ffmpeg unconditionally cost 109s of a 189s job — more
      # than clippy and the tests combined. Ask before paying: the runner image
      # may already have it, and if it does this step is seconds.
      # The downloaded .debs. apt deletes them after a successful install by
      # default, so the step below keeps them explicitly; without that this
      # cache would save an empty directory and quietly do nothing.
      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/check.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          # Keep the .debs so the cache above has something to save, and let apt
          # find any the cache restored.
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99keep-debs >/dev/null
          need=()
          pkg-config --exists gtk4 || need+=(libgtk-4-dev)
          command -v ffmpeg >/dev/null || need+=(ffmpeg)
          echo "ffmpeg preinstalled: $(command -v ffmpeg || echo no)"
          if [ ${#need[@]} -eq 0 ]; then
            echo "nothing to install"
          else
            echo "installing: ${need[*]}"
            sudo apt-get update
            timeout 5m sudo apt-get install -y --no-install-recommends "${need[@]}"
          fi
          ffmpeg -version | head -1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # One test run, inspected afterwards. Running the suite twice to check
      # whether it skipped would cost as much as the check is worth.
      #
      # The check matters because the media tests self-skip when ffmpeg is
      # missing, which is what CI did for a long time: every encoding and
      # snapshot test skipped while the badge stayed green. A suite that skips
      # looks exactly like a suite that passes.
      - name: Test
        run: |
          set -o pipefail
          cargo test --locked --workspace -- --nocapture 2>&1 | tee test.log
      - name: Confirm the media tests were not skipped
        run: |
          if grep -q 'skipping: ffmpeg not installed' test.log; then
            echo '::error::media tests skipped even though ffmpeg is installed'
            exit 1
          fi
          echo "media tests ran"
