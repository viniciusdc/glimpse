name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless. Cancel it rather than paying for
# both — except on main, where every commit's result is worth keeping.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # incremental artifacts are useless to a fresh runner

# Third-party actions are pinned to commit SHAs rather than tags. A tag is
# mutable: whoever controls the action can repoint v7 at new code, and it runs
# here with whatever permissions the job has. The trailing comment records which
# release each SHA was, since a bare SHA tells a reader nothing.

jobs:
  # Needs no toolchain and no system libraries, so it answers in seconds and
  # catches the largest category of finding this project has had: docs drifting
  # from the code.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make docs-check

  # Formatting needs rustfmt and nothing else — no GTK, no cache, no build.
  # Kept separate so it fails in ~15s instead of behind a five-minute compile.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: Clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ffmpeg is a RUNTIME dependency, and without it every encoding test
      # silently skips — which is what CI did until now, so the encode and
      # snapshot paths had no coverage here at all.
      # Measured: installing ffmpeg unconditionally cost 109s of a 189s job — more
      # than clippy and the tests combined. Ask before paying: the runner image
      # may already have it, and if it does this step is seconds.
      - name: Install system dependencies
        run: |
          need=()
          pkg-config --exists gtk4 || need+=(libgtk-4-dev)
          command -v ffmpeg >/dev/null || need+=(ffmpeg)
          echo "ffmpeg preinstalled: $(command -v ffmpeg || echo no)"
          if [ ${#need[@]} -eq 0 ]; then
            echo "nothing to install"
          else
            echo "installing: ${need[*]}"
            sudo apt-get update
            timeout 5m sudo apt-get install -y --no-install-recommends "${need[@]}"
          fi
          ffmpeg -version | head -1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo clippy --locked --all-targets -- -D warnings

      # One test run, inspected afterwards. Running the suite twice to check
      # whether it skipped would cost as much as the check is worth.
      #
      # The check matters because the media tests self-skip when ffmpeg is
      # missing, which is what CI did for a long time: every encoding and
      # snapshot test skipped while the badge stayed green. A suite that skips
      # looks exactly like a suite that passes.
      - name: Test
        run: |
          set -o pipefail
          cargo test --locked -- --nocapture 2>&1 | tee test.log
      - name: Confirm the media tests were not skipped
        run: |
          if grep -q 'skipping: ffmpeg not installed' test.log; then
            echo '::error::media tests skipped even though ffmpeg is installed'
            exit 1
          fi
          echo "media tests ran"
