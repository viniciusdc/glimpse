[package]
name = "glimpse"
version = "0.1.0"
edition = "2021"
description = "Animated GIF screen recorder with a framing window. Rust, GTK4, X11."
license = "Apache-2.0"

[dependencies]
gtk4 = "0.11"
gdk4-x11 = "0.11"
x11rb = { version = "0.14", features = ["shape"] }
anyhow = "1"

# gifski dropped from v0.1 per ADR 0002 — revisit only if the ffmpeg GIF output
# measures poorly. serde/toml return with settings persistence; see docs/roadmap.md.

[workspace]
