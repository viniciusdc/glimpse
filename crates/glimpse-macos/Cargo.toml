[package]
name = "glimpse-macos"
version = "0.1.0"
edition = "2021"
description = "The macOS capture backend of Glimpse: a rectangle becomes an avfoundation invocation."
license = "Apache-2.0"
repository = "https://github.com/viniciusdc/glimpse"

# Turning a rectangle into ffmpeg arguments is string building, so `grab` compiles
# and its tests run on every platform. That is deliberate: it means Linux CI
# checks the macOS argument construction, and it is why the toolkit dependencies
# below are in a target table rather than here. Everything that needs AppKit is
# behind `cfg(target_os = "macos")` in the source to match.
[dependencies]
anyhow = { workspace = true }
glimpse-core = { path = "../glimpse-core" }

# macOS-scoped, like gtk4 and for the same reason: `geometry`, `grab` and
# `layout` are portable and Linux CI compiles and tests them. `glimpse-ui` needs
# GTK, so making it unconditional here would drag GTK onto the Linux build of a
# crate whose portable half is the thing that check exists to protect.
[target.'cfg(target_os = "macos")'.dependencies]
gtk4 = { workspace = true }
glimpse-ui = { path = "../glimpse-ui" }
gdk4-macos = { version = "0.11", features = ["v4_8"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSResponder",
    "NSScreen",
    "NSView",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
