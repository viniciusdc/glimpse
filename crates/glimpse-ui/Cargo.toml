[package]
name = "glimpse-ui"
version = "0.1.0"
edition = "2021"
description = "Glimpse's chrome: the palette, the stylesheet, and the formatters the header shows."
license = "Apache-2.0"
repository = "https://github.com/viniciusdc/glimpse"

# NO DEPENDENCIES, and that is worth keeping for as long as it lasts.
#
# ADR 0014 predicted this crate would need `gtk4` unconditionally, and that Linux
# CI would therefore stop covering everything the macOS build compiles. That is
# true of the widget tree, which has not moved yet. It is not true of what is
# here: a palette, a stylesheet built by string substitution, and two
# formatters. None of it has ever needed a toolkit.
#
# So this half is testable on every platform, like `glimpse-core`. `gtk4` arrives
# with the widgets, not before — and when it does, the presentation could stay
# behind a feature or in its own module if the coverage turns out to be worth
# more than the tidiness.
#
# `PlatformHooks` did not change that. It names `ScreenPixelRect`, `GrabRequest`
# and `GrabCommand`, all of which live in `glimpse-core`, which is toolkit-free
# by manifest (ADR 0010). So the seam is testable everywhere too, and the four
# hooks below are exercised on Linux CI without a display.
# `gtk4` arrived with the widgets, as ADR 0014 said it would.
#
# What that record ALSO predicted has not happened: it expected Linux CI to stop
# covering everything the macOS build compiles. Both CI jobs install GTK — the
# Linux one for `glimpse-x11`, the macOS one since the window model landed — so
# this crate is compiled on both, and no feature gate is needed to keep the
# coverage. The prediction assumed CI had one GTK machine; it has two.
[dependencies]
anyhow = { workspace = true }
glimpse-core = { path = "../glimpse-core" }
gtk4 = { workspace = true }
